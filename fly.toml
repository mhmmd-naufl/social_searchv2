# fly.toml app configuration file generated for social-searchv2 on 2026-11-20T18:14:20Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'social-searchv2'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  COLLECTION_NAME = 'videos'
  DB_NAME = 'new_tiktok_db'
  USE_KBBI_LEXICON = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
